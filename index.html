<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Money | Grupo de Cupons</title>

  <!-- Prévia quando o link for compartilhado (WhatsApp, Instagram etc.) -->
  <meta property="og:title" content="Digital Money | Grupo de Cupons">
  <meta property="og:description" content="Cupons e achadinhos de tecnologia todos os dias no WhatsApp.">
  <meta name="description" content="Entre no grupo oficial da Digital Money no WhatsApp.">
  <meta name="theme-color" content="#0b141a">


  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --verde: #25d366;
      --verde-escuro: #128c7e;
      --dourado: #f5c542;
      --ouro: #e8b04b;
      --fundo: #0b0d12;
      --card: #111b21;
      --card-2: #1a262d;
      --texto: #e9edef;
      --texto-suave: #8696a0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--fundo);
      background-image:
        linear-gradient(180deg, rgba(8, 10, 14, 0.25), rgba(8, 10, 14, 0.6)),
        url("fundo.jpg");
      background-size: cover;
      background-position: center;
      color: var(--texto);
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(14, 16, 22, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(232, 176, 75, 0.18);
      border-radius: 24px;
      padding: 28px 24px 26px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      animation: entrar 0.5s ease-out;
    }

    @keyframes entrar {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Marca */
    .marca {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .marca-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--verde), var(--verde-escuro));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b141a;
      font-size: 16px;
      font-weight: 900;
    }

    .marca span { color: var(--dourado); }

    /* Ícone com anel de progresso */
    .icone-wrap {
      position: relative;
      width: 116px;
      height: 116px;
      margin: 0 auto 20px;
    }

    .anel {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .anel circle { fill: none; stroke-width: 4; }
    .anel .base { stroke: rgba(255, 255, 255, 0.35); }

    .anel .progresso {
      stroke: #000000;
      stroke-linecap: round;
      stroke-dasharray: 314;
      stroke-dashoffset: 314;
      transition: stroke-dashoffset 0.1s linear;
    }

    .icone {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      overflow: hidden;
      background: #1a1c22;
      animation: pulso 2s infinite;
    }

    @keyframes pulso {
      0%   { box-shadow: 0 0 0 0 rgba(232, 176, 75, 0.45); }
      70%  { box-shadow: 0 0 0 16px rgba(232, 176, 75, 0); }
      100% { box-shadow: 0 0 0 0 rgba(232, 176, 75, 0); }
    }

    .icone img { width: 100%; height: 100%; object-fit: cover; display: block; }

    h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 14px;
      color: var(--texto-suave);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .sub strong {
      color: var(--verde);
      text-shadow: 0 0 6px rgba(37, 211, 102, 0.8), 0 0 14px rgba(37, 211, 102, 0.5);
    }

    /* Benefícios */
    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 18px;
    }

    .chip {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(37, 211, 102, 0.10);
      color: var(--verde);
      border: 1px solid rgba(37, 211, 102, 0.25);
    }

    /* Aviso da descrição */
    .aviso {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      text-align: left;
      background: var(--card-2);
      border: 1px solid rgba(245, 197, 66, 0.35);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .aviso-icone {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(245, 197, 66, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .aviso-icone svg { width: 18px; height: 18px; fill: var(--dourado); }

    .aviso p {
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--texto);
    }

    .aviso b { color: var(--dourado); }

    .botao {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: var(--verde);
      color: #0b141a;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.15s, filter 0.15s;
    }

    .botao:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .botao:active { transform: translateY(0); }
    .botao svg { width: 22px; height: 22px; fill: currentColor; }

    .seguro {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--texto-suave);
    }

    .seguro svg { width: 14px; height: 14px; fill: var(--texto-suave); }

    /* Aviso simples */
    .destaque {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin: 6px 0 24px;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="icone-wrap">
      <svg class="anel" viewBox="0 0 110 110">
        <circle class="base" cx="55" cy="55" r="50"></circle>
        <circle class="progresso" id="progresso" cx="55" cy="55" r="50"></circle>
      </svg>
      <div class="icone">
        <img src="perfil.jpg" alt="Digital Money" width="96" height="96">
      </div>
    </div>

    <h1>Entrando na comunidade<br>Digital Money</h1>
    <p class="sub">Abrindo o WhatsApp em <strong id="contador">4</strong> segundos</p>

    <p class="destaque">Importante: leia a descrição do grupo</p>

    <a class="botao" id="botao" href="#">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Entrar no grupo
    </a>

    <div class="seguro">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></svg>
      Grupo oficial Digital Money
    </div>
  </main>

  <script>
    // =====================================================
    //  CONFIGURAÇÃO — troque só aqui quando mudar de grupo
    // =====================================================
    const LINK_DO_GRUPO = "https://chat.whatsapp.com/KsNdoQuJdV38DusGbkgOWe";
    const SEGUNDOS = 4;
    // =====================================================

    const botao = document.getElementById("botao");
    const contador = document.getElementById("contador");
    const progresso = document.getElementById("progresso");
    const circunferencia = 314;

    botao.href = LINK_DO_GRUPO;

    // Vai para o grupo uma única vez
    let jaFoi = false;
    function irParaGrupo() {
      if (jaFoi) return;
      jaFoi = true;
      clearInterval(timer);
      setTimeout(() => { window.location.href = LINK_DO_GRUPO; }, 400);
    }

    botao.addEventListener("click", (e) => {
      e.preventDefault();
      irParaGrupo();
    });

    const inicio = Date.now();
    const total = SEGUNDOS * 1000;

    const timer = setInterval(() => {
      const passado = Date.now() - inicio;
      const restante = Math.max(0, Math.ceil((total - passado) / 1000));
      contador.textContent = restante;
      progresso.style.strokeDashoffset = circunferencia * (1 - Math.min(passado / total, 1));

      if (passado >= total) {
        irParaGrupo();
      }
    }, 50);
  </script>

</body>
</html>
